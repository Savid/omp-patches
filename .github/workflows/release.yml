name: Release

# Hourly: when npm has a newer omp, move to it. On a push to master: release the
# changed series. Either way apply, check, test and build it, then publish the
# image and a GitHub release v<omp version>-r<n>.
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [master]
    paths: [patches/**, gateway/**, UPSTREAM]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/savid/omp

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(cat UPSTREAM)
          latest=$(npm view @oh-my-pi/pi-coding-agent version)
          if [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -1)" != "$current" ]; then
            version=$latest bump=true
            if [ "$GITHUB_EVENT_NAME" = schedule ] &&
              gh issue list --state open --search "\"Patches fail on omp $version\" in:title" --json number -q '.[].number' | grep -q .; then
              echo "omp $version already failed: an issue is open"; exit 0
            fi
          else
            version=$current bump=false
            last=$(git tag -l "v$version-r*" --sort=-v:refname | head -1)
            if [ -n "$last" ] && git diff --quiet "$last" HEAD -- patches gateway UPSTREAM; then
              echo "omp $version with this series is already released as $last"; exit 0
            fi
          fi
          revision=$(( $(git tag -l "v$version-r*" | sed "s/^v$version-r//" | sort -n | tail -1) + 1 ))
          {
            echo "release=true"
            echo "bump=$bump"
            echo "version=$version"
            echo "tag=v$version-r$revision"
          } >>"$GITHUB_OUTPUT"
          echo "releasing omp $version as v$version-r$revision (moved: $bump)"

      - name: Move to the new omp
        if: steps.plan.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          echo "$VERSION" >UPSTREAM
          (cd gateway && bun add --exact "@oh-my-pi/pi-coding-agent@$VERSION")
      - name: Apply
        if: steps.plan.outputs.release == 'true'
        run: scripts/apply.sh
      - name: Test
        if: steps.plan.outputs.release == 'true'
        run: scripts/test.sh
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.plan.outputs.release == 'true'
      - name: Build
        if: steps.plan.outputs.release == 'true'
        run: scripts/build.sh "$IMAGE:${{ steps.plan.outputs.tag }}"

      - name: Commit the move
        if: steps.plan.outputs.bump == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPSTREAM gateway/package.json gateway/bun.lock
          git commit -m "omp $VERSION"
          git push origin HEAD:master

      - name: Publish
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git tag "$TAG" && git push origin "$TAG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # amd64 and arm64 in one image; the arm64 half is built without emulation
          # (see gateway/Dockerfile).
          scripts/build.sh "$IMAGE:${TAG#v}" --platform linux/amd64,linux/arm64 \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" --push --quiet
          docker logout ghcr.io
          {
            echo "[omp $VERSION](https://github.com/can1357/oh-my-pi/releases/tag/v$VERSION) with:"
            echo
            python3 scripts/readme.py --notes
            echo
            echo "Image: \`$IMAGE:${TAG#v}\`"
          } >notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
          for issue in $(gh issue list --state open --search "\"Patches fail on omp\" in:title" --json number,title \
            -q ".[] | select(.title == \"Patches fail on omp $VERSION\") | .number"); do
            gh issue close "$issue" --comment "Released as $TAG."
          done

      - name: Report
        if: failure() && steps.plan.outputs.bump == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Patches fail on omp $VERSION"
          if gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number' | grep -q .; then
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          The series no longer applies to, or passes on, omp $VERSION: $RUN

          \`\`\`sh
          scripts/apply.sh $VERSION     # stops at the patch that no longer applies
          git -C upstream am --continue # once resolved; repeat for each
          echo $VERSION > UPSTREAM
          (cd gateway && bun add --exact @oh-my-pi/pi-coding-agent@$VERSION)
          scripts/test.sh && scripts/save.sh
          \`\`\`

          Pushing the fix to master releases it and closes this issue.
          EOF
          )"
