name: CI

# Apply, check, test and build the series without publishing anything.
on:
  pull_request:
  push:
    branches-ignore: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  series:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Patch list
        run: python3 scripts/readme.py --check
      - name: Apply
        run: scripts/apply.sh
      - name: Test
        run: scripts/test.sh
      - name: Build
        run: scripts/build.sh
